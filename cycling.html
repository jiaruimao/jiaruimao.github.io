.title { font-family: 'Jersey 20', sans-serif; font-size: 3rem; letter-spacing: .04em; text-transform: uppercase; color: #fff; line-height: 1; }
.list { width: 360px; flex: 0 0 auto; max-height: 90vh; overflow-y: auto; padding-right: 6px; }

.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.list h2 { font-family: 'Jersey 20', sans-serif; font-weight: 400; font-size: 1.15rem; letter-spacing: .08em; text-transform: uppercase; color: #fff; padding-bottom: 5px; border-bottom: 5px double #fff; margin: 20px 0 8px; }

.trail:hover .box, .trail input:focus-visible + .box { border-color: var(--accent); }
.trail input:checked + .box { background: var(--accent); border-color: var(--accent); color: #fff; }
.name { font-weight: 500; font-size: .95rem; line-height: 1.3; }
.trail input:checked ~ .txt .name { text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; color: var(--frame); }
.meta { font-family: 'IBM Plex Mono', monospace; font-size: .7rem; letter-spacing: .04em; text-transform: uppercase; color: var(--blue); margin-top: 2px; }

.map { flex: 1 1 auto; min-width: 0; width: 100%; max-width: 1100px; height: auto; max-height: 92vh; }
.states path { fill: var(--blue); stroke: #fff; stroke-width: 1.2; stroke-linejoin: round; }
.dot { fill: var(--accent); stroke: #fff; stroke-width: 1.6; }
.ring { fill: none; stroke: var(--accent); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }

<script>
  // Edit this list: id must be unique; checked state is saved in this browser.
  var TRAILS = [
    { group: 'Near home', items: [
      ['gap', 'Great Allegheny Passage', 'Pittsburgh, PA to Cumberland, MD \u00b7 150 mi'],
      ['co', 'C&O Canal Towpath', 'Cumberland, MD to Washington, DC \u00b7 184 mi'],

      ['montour', 'Montour Trail', 'Pittsburgh area, PA \u00b7 ~60 mi'],
      ['att', 'American Tobacco Trail', 'Durham to Apex, NC \u00b7 ~22 mi'],
      ['neuse', 'Neuse River Greenway', 'Raleigh, NC \u00b7 ~27 mi'] ] },
    { group: 'East coast classics', items: [
      ['ecg', 'East Coast Greenway', 'Maine to Florida \u00b7 ~3,000 mi'],
      ['creeper', 'Virginia Creeper Trail', 'Abingdon to Damascus, VA \u00b7 34 mi'],
      ['newriver', 'New River Trail', 'Southwest Virginia \u00b7 57 mi'],
      ['wod', 'Washington & Old Dominion Trail', 'Northern Virginia \u00b7 45 mi'],
      ['erie', 'Erie Canalway Trail', 'Buffalo to Albany, NY \u00b7 ~360 mi'],
      ['cape', 'Cape Cod Rail Trail', 'Cape Cod, MA \u00b7 ~22 mi'],
      ['island', 'Island Line Trail', 'Burlington, VT \u00b7 14 mi'],
      ['brp', 'Blue Ridge Parkway', 'Virginia to North Carolina \u00b7 469 mi'] ] },
    { group: 'Bucket list', items: [
      ['katy', 'Katy Trail', 'Missouri \u00b7 ~240 mi'],
      ['hiawatha', 'Route of the Hiawatha', 'Idaho / Montana \u00b7 15 mi'],
      ['gdmbr', 'Great Divide Mountain Bike Route', 'Canada to Mexico \u00b7 ~2,700 mi'],
      ['pacific', 'Pacific Coast Route', 'Washington to California \u00b7 ~1,800 mi'] ] }
  ];
  var KEY = 'jm-trails', saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  var total = 0;
  var html = TRAILS.map(function (g) {
    return '<h2>' + g.group + '</h2>' + g.items.map(function (t) {
      total++;
      return '<label class="trail"><input type="checkbox" data-id="' + t[0] + '"' + (saved[t[0]] ? ' checked' : '') + '><span class="box">\u2713</span><span class="txt"><div class="name">' + t[1].replace(/&/g, '&amp;') + '</div><div class="meta">' + t[2] + '</div></span></label>';
    }).join('');
  }).join('');
  document.getElementById('trails').innerHTML = html;
  function update() {
    var n = document.querySelectorAll('#trails input:checked').length;
    document.getElementById('progress').textContent = n + ' / ' + total + ' ridden';
    document.getElementById('barfill').style.width = (n / total * 100) + '%';
  }
  document.getElementById('trails').addEventListener('change', function (e) {
    saved[e.target.getAttribute('data-id')] = e.target.checked;
    try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (err) {}
    update();
  });
  update();
</script>
