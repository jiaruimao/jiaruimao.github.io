<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jiarui Mao</title>
<link rel="icon" type="image/png" href="img/favicon.png?v=2">
<link rel="alternate icon" type="image/svg+xml" href="img/favicon.svg?v=2">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jersey+20&family=Redaction+35:wght@400;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --navy:#27187E; --blue:#74A2FC; --accent:#FF5E00; --frame:#B0C6FF; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  padding: 40px 20px; font-family: 'IBM Plex Sans', sans-serif; color: #000;
  background: linear-gradient(180deg, #ffffff 0%, #ffffff 50%, #dbe5ff 78%, #B0C6FF 100%);
}
.panel { position: relative; z-index: 1; width: min(560px, 100%); padding: 44px 40px; background: rgba(255,255,255,0.62); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 6px double var(--frame); box-shadow: 0 10px 40px rgba(39,24,126,0.10); }
.kicker { font-family: 'Redaction 35', serif; font-size: 1rem; color: #5f8df0; margin-bottom: 6px; }
h1 { font-family: 'Jersey 20', sans-serif; font-size: 3.6rem; font-weight: 400; letter-spacing: .03em; line-height: 1; color: var(--accent); margin-bottom: 14px; }
p { line-height: 1.6; margin-bottom: 22px; }
.address { display: block; padding: 12px 14px; margin-bottom: 22px; border: 2px solid var(--navy); background: #fff; font-family: ui-monospace, Menlo, monospace; font-size: 1.05rem; color: var(--navy); user-select: all; word-break: break-all; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { font-family: 'Jersey 20', sans-serif; font-size: 1.25rem; letter-spacing: .03em; text-transform: uppercase; line-height: 1; padding: 9px 14px 8px; border: 2px solid var(--navy); background: transparent; color: var(--navy); box-shadow: 4px 4px 0 var(--navy); cursor: pointer; text-decoration: none; transition: transform .12s, box-shadow .12s, background .12s; }
.btn:hover { background: rgba(95,141,240,.18); transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--navy); }
.btn:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--navy); }
.btn.primary { background: var(--navy); color: #fff; box-shadow: 4px 4px 0 var(--blue); }
.btn.primary:hover { background: var(--navy); box-shadow: 5px 5px 0 var(--blue); }
.back { position: relative; z-index: 1; font-family: 'Jersey 20', sans-serif; font-size: 1.2rem; letter-spacing: .03em; color: var(--navy); text-decoration: none; text-transform: uppercase; }
.back:hover { color: #5f8df0; }
#bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
#bg-layer pre { position: absolute; top: 0; left: 0; margin: 0; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; line-height: 1; white-space: pre; color: #27187E; opacity: 0.55; user-select: none; }
.back-btn { position: fixed; top: 22px; left: 22px; z-index: 5; font-family: 'Jersey 20', sans-serif; font-size: 1.3rem; letter-spacing: .05em; text-transform: uppercase; line-height: 1; padding: 9px 14px 8px; background: var(--navy); color: #fff; text-decoration: none; transition: background .15s; }
.back-btn:hover { background: var(--accent); }


#g { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: block; cursor: grab; }
#g.drag { cursor: grabbing; }
#g.hit { cursor: pointer; }
.count { position: fixed; right: 22px; bottom: 74px; z-index: 5; font-family: 'Jersey 20', sans-serif; font-size: 2.4rem; letter-spacing: .03em; line-height: 1; color: var(--accent); text-align: right; pointer-events: none; }
.hint { position: fixed; right: 22px; bottom: 18px; z-index: 5; font-family: 'IBM Plex Mono', monospace; font-size: .72rem; color: #5f6fb0; text-align: right; line-height: 1.6; pointer-events: none; }
</style>
</head>
<body>
  <a class="back-btn" href="index.html#life">&larr; Back</a>
  <canvas id="g"></canvas>
  <div class="count" id="count"></div>
  <div class="hint">click a Pok&eacute;mon: colour + name<br>drag: rotate &middot; scroll: zoom</div>
<script>
(function () {
  var SPR = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
  var BLUE = '#3f6df0';
  var NAMES = {1:'Bulbasaur',4:'Charmander',7:'Squirtle',10:'Caterpie',13:'Weedle',16:'Pidgey',29:'Nidoran\u2640',32:'Nidoran\u2642',57:'Primeape',69:'Bellsprout',74:'Geodude',77:'Ponyta',79:'Slowpoke',81:'Magnemite',92:'Gastly',95:'Onix',98:'Krabby',100:'Voltorb',102:'Exeggcute',104:'Cubone',109:'Koffing',111:'Rhyhorn',59:'Arcanine',199:'Slowking',9:'Blastoise',94:'Gengar',403:'Shinx',403:'Shinx',470:'Leafeon',778:'Mimikyu',702:'Dedenne',925:'Maushold',129:'Magikarp',131:'Lapras',143:'Snorlax',229:'Houndoom',641:'Tornadus'};
  // PIs: name, their Pokemon id, named = ids of named small Pokemon, dots = how many grey (not named yet) dots
  var PIS = [
    { dept: 'bric', pi: 'Li Wang',       id: 57,  dots: 10 },
    { dept: 'bric', pi: 'Gang Li',       id: 74,  dots: 10 },
    { dept: 'bric', pi: 'Mingxia',       id: 131, dots: 5 },
    { dept: 'bric', pi: 'Pew-Thian Yap', id: 129, named: [{ id: 9, who: 'Khoi', role: 'student' }, { id: 403, who: 'Me!', role: 'student', col: '#FF5E00' }, { id: 94, who: 'Ana', role: 'student' }], dots: 17 },
    { dept: 'cs', pi: 'Stephen M. Pizer', id: 641, dots: 0 },
    { dept: 'cs', pi: 'Roni Sengupta', id: 229, dots: 0 },
    { dept: 'cs', pi: 'Praneeth Chakravarthula', id: 59, dots: 0 },
    { dept: 'cs', pi: 'Tianlong Chen', id: 143, dots: 0 },
    { dept: 'pitt', pi: 'Samantha Hauser', id: 702, dots: 0 },
    { dept: 'pitt', pi: 'Aravind Parthasarathy', id: 925, dots: 0 },
    { dept: 'pitt', pi: 'Hari Bharadwaj', id: 199, named: [{ id: 778, who: 'Liz' }] }
  ];
  var nodes = [], edges = [];
  function add(o) { var r = 90 + Math.random() * 120, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
    o.x = r * Math.sin(b) * Math.cos(a); o.y = r * Math.sin(b) * Math.sin(a); o.z = r * Math.cos(b); o.vx = o.vy = o.vz = 0; o.rev = false; o.pi = false; nodes.push(o); return nodes.length - 1; }
  var unc = add({ type: 'hub', label: 'UNC' }), cs = add({ type: 'hub', label: 'CS' }), med = add({ type: 'hub', label: 'Med School' }),
      bio = add({ type: 'hub', label: 'Biostats' }), pitt = add({ type: 'hub', label: 'Pitt' }), bric = add({ type: 'hub', label: 'BRIC' });
  edges.push([unc, cs, 130], [unc, med, 130], [unc, bio, 130], [med, bric, 130]);
  PIS.forEach(function (P) {
    var h = add({ type: 'pi', id: P.id, owner: P.pi, name: NAMES[P.id], role: P.role, size: 76 });
    edges.push([P.dept === 'cs' ? cs : P.dept === 'pitt' ? pitt : bric, h, 170]);
    (P.named || []).forEach(function (k) {   // named sub-Pokemon (sprites); click = Pokemon name, right-click = who they are (who), col = optional silhouette colour
      edges.push([h, add({ type: 'mon', id: k.id, owner: P.pi, who: k.who, name: NAMES[k.id], role: k.role, col: k.col, size: 44 }), 85]);
    });
    for (var d = 0; d < (P.dots || 0); d++) edges.push([h, add({ type: 'dot', owner: P.pi, size: 16, parent: h }), 85]);   // not named yet
  });
  // Med School: Yueh Z. Lee (no Pokemon yet = grey dot) with Leafeon = Truc under them
  var yz = add({ type: 'dot', owner: 'Yueh Z. Lee', size: 16, parent: med, lit: true });
  edges.push([med, yz, 150], [yz, add({ type: 'mon', id: 470, owner: 'Yueh Z. Lee', who: 'Truc', role: 'student', name: 'Leafeon', size: 44 }), 85]);
  var GO_TOTAL = 951;   // species currently in Pokemon GO (sources range ~896-954); edit when it changes
  var named = nodes.filter(function (n) { return n.type === 'pi' || n.type === 'mon'; }).length;
  document.getElementById('count').textContent = 'Pok\u00e9mon ' + named + '/' + GO_TOTAL;
  // more links = bigger node (like Obsidian)
  var deg = nodes.map(function () { return 0; });
  edges.forEach(function (e) { deg[e[0]]++; deg[e[1]]++; });
  var START = { PI: 45, postdoc: 30, student: 30 }, PER_LINK = 3.4;   // size = start size of their role + PER_LINK per connection
  nodes.forEach(function (n, i) { n.deg = deg[i]; if (n.type === 'pi' || n.type === 'mon') n.size = START[n.role || 'PI'] + PER_LINK * n.deg; if (n.type === 'hub') n.r = 6 + 2.2 * n.deg; });
  // sprites -> normal + blue silhouette
  var img = {}, sil = {};
  nodes.forEach(function (n) { if (n.id && !img[n.id]) {
    var im = new Image(); im.onload = function () {
      var c = document.createElement('canvas'); c.width = im.width; c.height = im.height; var x = c.getContext('2d');
      x.drawImage(im, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = n.col || BLUE; x.fillRect(0, 0, c.width, c.height); sil[n.id] = c; };
    im.src = SPR + n.id + '.png'; img[n.id] = im; } });

  function lit(n) { return n.type !== 'dot' || n.lit || nodes[n.parent].rev; }   // grey dots (and their links) are faint until their PI Pokemon is clicked
  var cv = document.getElementById('g'), ctx = cv.getContext('2d'), W = 0, H = 0, dpr = 1;
  function size() { dpr = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
  size(); addEventListener('resize', size);
  var yaw = 0.5, pitch = -0.25, zoom = 1, spin = 0, dragging = false, moved = 0, lx = 0, ly = 0, hover = null;

  function physics() {
    var N = nodes.length, i, j, a, b, dx, dy, dz, d2, d, f;
    for (i = 0; i < N; i++) for (j = i + 1; j < N; j++) {
      a = nodes[i]; b = nodes[j]; dx = a.x - b.x; dy = a.y - b.y; dz = a.z - b.z; d2 = dx * dx + dy * dy + dz * dz + 40; d = Math.sqrt(d2);
      f = 5200 / d2; dx /= d; dy /= d; dz /= d;
      a.vx += dx * f; a.vy += dy * f; a.vz += dz * f; b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f;
    }
    edges.forEach(function (e) {
      a = nodes[e[0]]; b = nodes[e[1]]; dx = b.x - a.x; dy = b.y - a.y; dz = b.z - a.z; d = Math.sqrt(dx * dx + dy * dy + dz * dz) + .01;
      f = (d - e[2]) * 0.02; dx /= d; dy /= d; dz /= d;
      a.vx += dx * f; a.vy += dy * f; a.vz += dz * f; b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f;
    });
    nodes.forEach(function (n) {
      n.vx -= n.x * 0.002; n.vy -= n.y * 0.002; n.vz -= n.z * 0.002;
      n.vx *= .86; n.vy *= .86; n.vz *= .86; n.x += n.vx; n.y += n.vy; n.z += n.vz; });
  }
  function project() {
    var cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), cam = 900;
    nodes.forEach(function (n) {
      var x1 = n.x * cy + n.z * sy, z1 = -n.x * sy + n.z * cy, y1 = n.y * cp - z1 * sp, z2 = n.y * sp + z1 * cp;
      var f = cam / (cam + z2) * zoom; n.sx = W / 2 + x1 * f; n.sy = H / 2 + y1 * f; n.sz = z2; n.f = f; });
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1.2;
    edges.forEach(function (e) { var a = nodes[e[0]], b = nodes[e[1]], al = Math.max(.05, Math.min(.3, .2 - (a.sz + b.sz) / 3000));
      if (!lit(a) || !lit(b)) al *= .3;
      ctx.strokeStyle = 'rgba(63,109,240,' + al + ')'; ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke(); });
    var order = nodes.slice().sort(function (a, b) { return b.sz - a.sz; });
    ctx.imageSmoothingEnabled = false; ctx.textAlign = 'center';
    order.forEach(function (n) {
      var depth = Math.max(.35, Math.min(1, 1 - n.sz / 700));
      if (n.type === 'dot') {
        ctx.globalAlpha = depth * (lit(n) ? .55 : .2); ctx.fillStyle = '#b3b3b3'; ctx.beginPath(); ctx.arc(n.sx, n.sy, 7 * n.f * (n === hover ? 1.3 : 1), 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
        if (n.pi) { var f2 = Math.max(12, 19 * n.f); ctx.font = f2 + 'px "Jersey 20", sans-serif'; ctx.fillStyle = '#FF5E00'; ctx.fillText(n.owner, n.sx, n.sy - 12 * n.f); }
        return; }
      if (n.type === 'hub') {
        ctx.globalAlpha = depth; ctx.fillStyle = '#fff'; ctx.strokeStyle = BLUE; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(n.sx, n.sy, n.r * n.f, 0, 6.283); ctx.fill(); ctx.stroke();
        ctx.font = (20 * Math.max(.7, n.f)) + 'px "Jersey 20", sans-serif'; ctx.fillStyle = '#27187E'; ctx.fillText(n.label, n.sx, n.sy - (n.r + 5) * n.f); ctx.globalAlpha = 1; return; }
      var s = n.size * n.f * (n === hover ? 1.15 : 1), src = n.rev ? img[n.id] : sil[n.id];
      ctx.globalAlpha = depth;
      if (src && (n.rev ? src.complete && src.naturalWidth : true)) ctx.drawImage(src, n.sx - s / 2, n.sy - s / 2, s, s);
      ctx.globalAlpha = 1;
      var fs = Math.max(12, 19 * n.f);
      if (n.rev) { ctx.font = fs + 'px "Jersey 20", sans-serif'; ctx.fillStyle = '#27187E'; ctx.fillText(n.name, n.sx, n.sy + s / 2 + fs * .8); }
      if (n.pi) { ctx.font = fs + 'px "Jersey 20", sans-serif'; ctx.fillStyle = '#FF5E00'; ctx.fillText(n.who || n.owner, n.sx, n.sy - s / 2 - fs * .3); }
    });
  }
  function pick(mx, my, dots) {
    var best = null, bz = 1e9;
    nodes.forEach(function (n) { if (n.type === 'hub' || (n.type === 'dot' && !dots)) return; var r = n.size * n.f * .5; if (Math.abs(mx - n.sx) < r && Math.abs(my - n.sy) < r && n.sz < bz) { best = n; bz = n.sz; } });
    return best;
  }
  function loop() { physics(); if (!dragging) yaw += spin; project(); draw(); requestAnimationFrame(loop); }
  cv.addEventListener('pointerdown', function (e) { dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) {
    if (dragging) { var dx = e.clientX - lx, dy = e.clientY - ly; moved += Math.abs(dx) + Math.abs(dy); yaw += dx * .006; pitch = Math.max(-1.4, Math.min(1.4, pitch + dy * .006)); lx = e.clientX; ly = e.clientY; }
    else { hover = pick(e.clientX, e.clientY, true); cv.classList.toggle('hit', !!hover && hover.type !== 'dot'); } });
  cv.addEventListener('pointerup', function (e) {
    dragging = false; cv.classList.remove('drag');
    if (moved < 5 && e.button === 0) { var n = pick(e.clientX, e.clientY); if (n) n.rev = !n.rev; } });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); var n = pick(e.clientX, e.clientY, true); if (n) n.pi = !n.pi; });
  cv.addEventListener('wheel', function (e) { e.preventDefault(); zoom = Math.max(.4, Math.min(3, zoom * (e.deltaY < 0 ? 1.08 : .92))); }, { passive: false });
  loop();
})();
</script>
</body>
</html>
